# Sert le build Vite (dist/). __API_ORIGIN__ est remplacé au build de l'image
# par l'origine de VITE_API_URL (voir Dockerfile).
server {
    listen 4173;
    server_tokens off;
    root /usr/share/nginx/html;

    # La clé de déchiffrement est dans le fragment de l'URL : un script injecté
    # pourrait la lire. Aucun script hors de nos fichiers, aucun inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; form-action 'self' __API_ORIGIN__; frame-src https://status.silvertransfert.fr; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # /t/<id> ne fuit pas vers les sites tiers (polices, liens sortants).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par Vite (hash dans le nom).
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }
}
