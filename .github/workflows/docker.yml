# Construit l'image du frontend et la pousse sur ghcr.io, rattachée au dépôt
# deployment_files (privé : l'image hérite de sa visibilité et de ses accès).
# Secret requis : GHCR_TOKEN (PAT classique, scope write:packages).
# Variable requise : PUBLIC_API_URL (URL HTTPS de l'API, figée dans le bundle).
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/silvercore-git/silvertransfert-front
          # latest = main ; sinon nom de branche / tag, plus le sha court
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: org.opencontainers.image.source=https://github.com/SilverCore-Git/deployment_files
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VITE_API_URL=${{ vars.PUBLIC_API_URL }}
